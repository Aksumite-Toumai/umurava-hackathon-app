name: Next.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node and cache pnpm modules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # pnpm install with frozen-lockfile
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Run checks
      - name: Run Type Checking
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm run lint
